<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Thank You - Zarius Developer Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"

    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .thank-you-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            text-align: center;
        }
        .thank-you-icon {
            font-size: 3rem;
            color: #198754;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="thank-you-card">
            <div class="thank-you-icon">
                <i class="bi bi-check-circle-fill"></i>
            </div>
            <h1 class="mt-3">Thank You!</h1>
            <p class="text-muted">Your message has been sent successfully. I will get back to you as soon as possible!</p>
            <p class="text-muted">zarius</p>
            <a href="index.html" class="btn btn-success mt-4">Go Back to Home</a>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
